<script>
  // ============================================================================
  // FUNCIONES DE COMUNICACIÓN CON APPS SCRIPT
  // ============================================================================
  
  /**
   * Aplica un formato de bloque específico a la selección actual.
   */
  function aplicarFormato(tipoBloque) {
    mostrarCargando('Aplicando formato...');
    
    // Mapeo de tipos a funciones de Apps Script
    const funcionesConversion = {
      'ESCENA': 'applySceneHeading',
      'ACCION': 'applyAction',
      'PERSONAJE': 'applyCharacter',
      'DIALOGO': 'applyDialogue',
      'PARENTETICO': 'applyParenthetical',
      'TRANSICION': 'applyTransition',
      'NOTA': 'applyActBreak',
      'ACTO': 'applyActBreak'
    };
    
    const funcion = funcionesConversion[tipoBloque];
    
    if (funcion) {
      google.script.run
        .withSuccessHandler(onSuccess)
        .withFailureHandler(onError)
        [funcion]();
    }
  }
  
  /**
   * Renumera todas las escenas del documento.
   */
  function renumerarEscenas() {
    mostrarCargando('Renumerando escenas...');
    google.script.run
      .withSuccessHandler(function() {
        onSuccess();
        // Recargar el índice automáticamente
        setTimeout(cargarEscenas, 500);
      })
      .withFailureHandler(onError)
      .renumerarTodasLasEscenas();
  }
  
  // ============================================================================
  // FUNCIONES DE NAVEGACIÓN
  // ============================================================================
  
  /**
   * Navega a la escena anterior.
   */
  function irEscenaAnterior() {
    google.script.run
      .withSuccessHandler(onSuccess)
      .withFailureHandler(onError)
      .goToPreviousScene();
  }
  
  /**
   * Navega a la escena siguiente.
   */
  function irEscenaSiguiente() {
    google.script.run
      .withSuccessHandler(onSuccess)
      .withFailureHandler(onError)
      .goToNextScene();
  }
  
  /**
   * Carga y muestra el índice de escenas.
   */
  function cargarEscenas() {
    const contenedor = document.getElementById('indice-escenas');
    contenedor.innerHTML = '<p class="loading">Cargando escenas</p>';
    
    google.script.run
      .withSuccessHandler(function(jsonEscenas) {
        try {
          const escenas = JSON.parse(jsonEscenas);
          mostrarEscenas(escenas);
        } catch (error) {
          console.error('Error al parsear escenas:', error);
          contenedor.innerHTML = '<p class="empty-state">Error al cargar escenas</p>';
        }
      })
      .withFailureHandler(function(error) {
        console.error('Error al obtener escenas:', error);
        contenedor.innerHTML = '<p class="empty-state">Error: ' + error.message + '</p>';
      })
      .obtenerIndiceEscenasJSON();
  }
  
  /**
   * Muestra las escenas en el sidebar.
   */
  function mostrarEscenas(escenas) {
    const contenedor = document.getElementById('indice-escenas');
    
    if (!escenas || escenas.length === 0) {
      contenedor.innerHTML = '<p class="empty-state">No se encontraron escenas.<br>Escribe un encabezado que empiece con INT. o EXT.</p>';
      return;
    }
    
    let html = '';
    escenas.forEach(function(escena) {
      html += '<div class="escena-item" onclick="navegarA(' + escena.indice + ')">';
      html += '<span class="escena-numero">' + escena.numero + '</span>';
      html += '<span class="escena-texto">' + escaparHTML(escena.texto.substring(0, 40));
      if (escena.texto.length > 40) html += '...';
      html += '</span>';
      html += '</div>';
    });
    
    contenedor.innerHTML = html;
  }
  
  /**
   * Navega a una escena específica.
   */
  function navegarA(indice) {
    google.script.run
      .withSuccessHandler(onSuccess)
      .withFailureHandler(onError)
      .navegarAEscena(indice);
  }
  
  // ============================================================================
  // FUNCIONES DE AUTOCOMPLETADO
  // ============================================================================
  
  /**
   * Carga la lista de personajes.
   */
  function cargarPersonajes() {
    const contenedor = document.getElementById('lista-personajes');
    contenedor.innerHTML = '<p class="loading">Cargando personajes</p>';
    
    google.script.run
      .withSuccessHandler(function(jsonPersonajes) {
        try {
          const personajes = JSON.parse(jsonPersonajes);
          mostrarPersonajes(personajes);
        } catch (error) {
          console.error('Error al parsear personajes:', error);
          contenedor.innerHTML = '<p class="empty-state">Error al cargar personajes</p>';
        }
      })
      .withFailureHandler(function(error) {
        console.error('Error al obtener personajes:', error);
        contenedor.innerHTML = '<p class="empty-state">Error: ' + error.message + '</p>';
      })
      .obtenerPersonajesJSON();
  }
  
  /**
   * Muestra los personajes en el sidebar.
   */
  function mostrarPersonajes(personajes) {
    const contenedor = document.getElementById('lista-personajes');
    
    if (!personajes || personajes.length === 0) {
      contenedor.innerHTML = '<p class="empty-state">No se encontraron personajes.<br>Añade bloques de personaje primero.</p>';
      return;
    }
    
    let html = '';
    personajes.forEach(function(personaje) {
      html += '<div class="item-clickable" onclick="insertarPersonaje(\'' + 
              escaparComillas(personaje) + '\')">';
      html += escaparHTML(personaje);
      html += '</div>';
    });
    
    contenedor.innerHTML = html;
  }
  
  /**
   * Inserta un nombre de personaje.
   */
  function insertarPersonaje(nombre) {
    google.script.run
      .withSuccessHandler(onSuccess)
      .withFailureHandler(onError)
      .insertarNombrePersonaje(nombre);
  }
  
  /**
   * Carga la lista de localizaciones.
   */
  function cargarLocalizaciones() {
    const contenedor = document.getElementById('lista-localizaciones');
    contenedor.innerHTML = '<p class="loading">Cargando localizaciones</p>';
    
    google.script.run
      .withSuccessHandler(function(jsonLocalizaciones) {
        try {
          const localizaciones = JSON.parse(jsonLocalizaciones);
          mostrarLocalizaciones(localizaciones);
        } catch (error) {
          console.error('Error al parsear localizaciones:', error);
          contenedor.innerHTML = '<p class="empty-state">Error al cargar localizaciones</p>';
        }
      })
      .withFailureHandler(function(error) {
        console.error('Error al obtener localizaciones:', error);
        contenedor.innerHTML = '<p class="empty-state">Error: ' + error.message + '</p>';
      })
      .obtenerLocalizacionesJSON();
  }
  
  /**
   * Muestra las localizaciones en el sidebar.
   */
  function mostrarLocalizaciones(localizaciones) {
    const contenedor = document.getElementById('lista-localizaciones');
    
    if (!localizaciones || localizaciones.length === 0) {
      contenedor.innerHTML = '<p class="empty-state">No se encontraron localizaciones.<br>Añade encabezados de escena primero.</p>';
      return;
    }
    
    let html = '';
    localizaciones.forEach(function(loc) {
      html += '<div class="item-clickable" onclick="insertarLocalizacion(\'' + 
              escaparComillas(loc) + '\')">';
      html += escaparHTML(loc);
      html += '</div>';
    });
    
    contenedor.innerHTML = html;
  }
  
  /**
   * Inserta una localización en una nueva escena.
   */
  function insertarLocalizacion(localizacion) {
    google.script.run
      .withSuccessHandler(onSuccess)
      .withFailureHandler(onError)
      .insertarEscenaConLocalizacion(localizacion, 'INT.', 'DÍA');
  }
  
  // ============================================================================
  // FUNCIONES DE PLANTILLAS
  // ============================================================================
  
  /**
   * Inserta una plantilla predefinida.
   */
  function insertarPlantilla(tipo) {
    const plantillas = {
      'escena-int-dia': { funcion: 'insertarEscenaConLocalizacion', params: ['LOCALIZACIÓN', 'INT.', 'DÍA'] },
      'escena-ext-dia': { funcion: 'insertarEscenaConLocalizacion', params: ['LOCALIZACIÓN', 'EXT.', 'DÍA'] },
      'escena-int-noche': { funcion: 'insertarEscenaConLocalizacion', params: ['LOCALIZACIÓN', 'INT.', 'NOCHE'] },
      'escena-ext-noche': { funcion: 'insertarEscenaConLocalizacion', params: ['LOCALIZACIÓN', 'EXT.', 'NOCHE'] },
      'corte-a': { funcion: 'insertarBloqueNuevo', params: ['TRANSICION', 'CORTE A:'] },
      'disolvencia': { funcion: 'insertarBloqueNuevo', params: ['TRANSICION', 'DISOLVENCIA A:'] }
    };
    
    const plantilla = plantillas[tipo];
    if (plantilla) {
      google.script.run
        .withSuccessHandler(onSuccess)
        .withFailureHandler(onError)
        [plantilla.funcion].apply(null, plantilla.params);
    }
  }
  
  // ============================================================================
  // FUNCIONES DE ESTADÍSTICAS
  // ============================================================================
  
  /**
   * Muestra las estadísticas del guion.
   */
  function mostrarEstadisticas() {
    google.script.run
      .withSuccessHandler(function() {
        // Las estadísticas se muestran en un diálogo nativo de Google Docs
      })
      .withFailureHandler(onError)
      .mostrarEstadisticasGuion();
  }
  
  // ============================================================================
  // UTILIDADES
  // ============================================================================
  
  /**
   * Escapa HTML para prevenir XSS.
   */
  function escaparHTML(texto) {
    const div = document.createElement('div');
    div.textContent = texto;
    return div.innerHTML;
  }
  
  /**
   * Escapa comillas para uso en atributos HTML.
   */
  function escaparComillas(texto) {
    return texto.replace(/'/g, "\\'").replace(/"/g, '&quot;');
  }
  
  /**
   * Muestra un indicador de carga.
   */
  function mostrarCargando(mensaje) {
    // Podrías implementar un toast o loading overlay aquí
    console.log(mensaje);
  }
  
  /**
   * Callback de éxito para operaciones de Apps Script.
   */
  function onSuccess() {
    console.log('Operación completada con éxito');
  }
  
  /**
   * Callback de error para operaciones de Apps Script.
   */
  function onError(error) {
    console.error('Error:', error);
    alert('Error: ' + error.message);
  }
  
  // ============================================================================
  // INICIALIZACIÓN
  // ============================================================================
  
  /**
   * Se ejecuta cuando el sidebar termina de cargar.
   */
  document.addEventListener('DOMContentLoaded', function() {
    console.log('Sidebar cargado correctamente');
    
    // Cargar automáticamente el índice de escenas
    setTimeout(cargarEscenas, 500);
  });
</script>
