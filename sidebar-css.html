<style>
  /* RESET Y BASE */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    color: #202124;
    background-color: #ffffff;
    padding: 0;
    margin: 0;
  }
  
  .container {
    padding: 16px;
    max-width: 100%;
  }
  
  /* ENCABEZADO */
  .header {
    text-align: center;
    padding: 16px 0;
    border-bottom: 2px solid #1a73e8;
    margin-bottom: 20px;
  }
  
  .header h1 {
    font-size: 24px;
    color: #1a73e8;
    margin-bottom: 4px;
    font-weight: 600;
  }
  
  .subtitle {
    font-size: 12px;
    color: #5f6368;
    font-weight: 400;
  }
  
  /* SECCIONES */
  .section {
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid #e8eaed;
  }
  
  .section:last-child {
    border-bottom: none;
  }
  
  .section h2 {
    font-size: 16px;
    font-weight: 600;
    color: #202124;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
  }
  
  /* BOTONES BASE */
  .btn {
    display: inline-block;
    padding: 10px 16px;
    border: none;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: center;
    width: 100%;
    margin-bottom: 8px;
    box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
  }
  
  .btn:hover {
    box-shadow: 0 1px 3px 0 rgba(60,64,67,0.3), 0 4px 8px 3px rgba(60,64,67,0.15);
    transform: translateY(-1px);
  }
  
  .btn:active {
    transform: translateY(0);
    box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3);
  }
  
  /* TIPOS DE BOTONES */
  .btn-primary {
    background-color: #1a73e8;
    color: white;
  }
  
  .btn-primary:hover {
    background-color: #1765cc;
  }
  
  .btn-secondary {
    background-color: #5f6368;
    color: white;
  }
  
  .btn-secondary:hover {
    background-color: #4d5156;
  }
  
  .btn-tertiary {
    background-color: #34a853;
    color: white;
  }
  
  .btn-tertiary:hover {
    background-color: #2d8e47;
  }
  
  .btn-special {
    background-color: #ea4335;
    color: white;
  }
  
  .btn-special:hover {
    background-color: #d33426;
  }
  
  .btn-action {
    background-color: #fbbc04;
    color: #202124;
    font-weight: 600;
  }
  
  .btn-action:hover {
    background-color: #f9ab00;
  }
  
  .btn-info {
    background-color: #8430ce;
    color: white;
  }
  
  .btn-info:hover {
    background-color: #7627bd;
  }
  
  .btn-fountain {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    font-weight: 700;
    text-shadow: 0 1px 2px rgba(0,0,0,0.2);
  }
  
  .btn-fountain:hover {
    background: linear-gradient(135deg, #5568d3 0%, #65408a 100%);
  }
  
  .btn-fountain-light {
    background: linear-gradient(135deg, #a8c0ff 0%, #c8b6ff 100%);
    color: #202124;
    font-weight: 600;
  }
  
  .btn-fountain-light:hover {
    background: linear-gradient(135deg, #92a9e8 0%, #b29fe8 100%);
  }
  
  .btn-small {
    padding: 6px 10px;
    font-size: 11px;
  }
  
  .btn-full {
    width: 100%;
  }
  
  /* GRIDS */
  .button-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  
  .plantillas-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  
  /* LISTAS */
  .escenas-lista,
  .items-lista {
    max-height: 300px;
    overflow-y: auto;
    border: 1px solid #e8eaed;
    border-radius: 4px;
    padding: 8px;
    background-color: #f8f9fa;
  }
  
  .escena-item,
  .item-clickable {
    padding: 8px 12px;
    margin-bottom: 6px;
    background-color: white;
    border-radius: 4px;
    cursor: pointer;
    border-left: 3px solid #1a73e8;
    transition: all 0.2s ease;
    font-size: 12px;
  }
  
  .escena-item:hover,
  .item-clickable:hover {
    background-color: #e8f0fe;
    transform: translateX(4px);
  }
  
  .escena-numero {
    display: inline-block;
    background-color: #1a73e8;
    color: white;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    margin-right: 8px;
  }
  
  .escena-texto {
    color: #202124;
    font-weight: 500;
  }
  
  .info-text {
    text-align: center;
    color: #5f6368;
    font-size: 12px;
    padding: 20px;
    font-style: italic;
  }
  
  .empty-state {
    text-align: center;
    color: #80868b;
    font-size: 12px;
    padding: 16px;
  }
  
  /* PERSONAJES Y LOCALIZACIONES */
  .item-clickable {
    border-left-color: #34a853;
    font-family: 'Courier New', monospace;
    font-weight: 600;
    font-size: 11px;
  }
  
  /* PIE DE PÁGINA */
  .footer {
    margin-top: 32px;
    padding-top: 16px;
    border-top: 2px solid #e8eaed;
    text-align: center;
    color: #5f6368;
    font-size: 11px;
  }
  
  .footer p {
    margin-bottom: 4px;
  }
  
  /* SCROLLBAR PERSONALIZADA */
  .escenas-lista::-webkit-scrollbar,
  .items-lista::-webkit-scrollbar {
    width: 8px;
  }
  
  .escenas-lista::-webkit-scrollbar-track,
  .items-lista::-webkit-scrollbar-track {
    background: #f1f3f4;
    border-radius: 4px;
  }
  
  .escenas-lista::-webkit-scrollbar-thumb,
  .items-lista::-webkit-scrollbar-thumb {
    background: #c1c1c1;
    border-radius: 4px;
  }
  
  .escenas-lista::-webkit-scrollbar-thumb:hover,
  .items-lista::-webkit-scrollbar-thumb:hover {
    background: #a8a8a8;
  }
  
  /* LOADING STATE */
  .loading {
    text-align: center;
    padding: 20px;
    color: #5f6368;
  }
  
  .loading::after {
    content: '...';
    animation: dots 1.5s infinite;
  }
  
  @keyframes dots {
    0%, 20% { content: '.'; }
    40% { content: '..'; }
    60%, 100% { content: '...'; }
  }
  
  /* BADGES */
  .badge {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 3px;
    font-size: 10px;
    font-weight: 600;
    margin-left: 4px;
  }
  
  .badge-count {
    background-color: #e8f0fe;
    color: #1a73e8;
  }
  
  /* RESPONSIVE */
  @media (max-width: 300px) {
    .button-grid,
    .plantillas-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
